<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#E3EEEC"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#12302E">Why Your Nose Gets Crusty and How to Clear It Safely</text>
  <text x="60" y="110" font-size="20" fill="#536866">A gentle 6-step routine: soften first, never pick</text>

  <!-- Row 1 -->
  <rect x="60" y="130" width="346" height="130" rx="16" fill="#FFFFFF"/>
  <circle cx="96" cy="168" r="20" fill="#1FA5A0"/>
  <text x="96" y="175" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="128" y="175" font-size="20" font-weight="bold" fill="#12302E">Wash your hands</text>
  <text x="80" y="213" font-size="17" fill="#536866">Dirty fingers carry germs</text>
  <text x="80" y="237" font-size="17" fill="#536866">into a scratched nose.</text>

  <rect x="427" y="130" width="346" height="130" rx="16" fill="#FFFFFF"/>
  <circle cx="463" cy="168" r="20" fill="#1FA5A0"/>
  <text x="463" y="175" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="495" y="175" font-size="20" font-weight="bold" fill="#12302E">Soften the crust</text>
  <text x="447" y="213" font-size="17" fill="#536866">2 to 3 saline sprays per nostril,</text>
  <text x="447" y="237" font-size="17" fill="#536866">or a warm shower or steam.</text>

  <rect x="794" y="130" width="346" height="130" rx="16" fill="#FFFFFF"/>
  <circle cx="830" cy="168" r="20" fill="#1FA5A0"/>
  <text x="830" y="175" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="862" y="175" font-size="20" font-weight="bold" fill="#12302E">Wait 5 to 10 minutes</text>
  <text x="814" y="213" font-size="17" fill="#536866">The crust should loosen and</text>
  <text x="814" y="237" font-size="17" fill="#536866">feel less stuck.</text>

  <!-- Row 2 -->
  <rect x="60" y="278" width="346" height="130" rx="16" fill="#FFFFFF"/>
  <circle cx="96" cy="316" r="20" fill="#1FA5A0"/>
  <text x="96" y="323" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="128" y="323" font-size="20" font-weight="bold" fill="#12302E">Blow gently</text>
  <text x="80" y="361" font-size="17" fill="#536866">One nostril at a time,</text>
  <text x="80" y="385" font-size="17" fill="#536866">with light pressure.</text>

  <rect x="427" y="278" width="346" height="130" rx="16" fill="#FFFFFF"/>
  <circle cx="463" cy="316" r="20" fill="#1FA5A0"/>
  <text x="463" y="323" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="495" y="323" font-size="20" font-weight="bold" fill="#12302E">Wipe what comes easily</text>
  <text x="447" y="361" font-size="17" fill="#536866">Damp swab or tissue at the</text>
  <text x="447" y="385" font-size="17" fill="#536866">opening. Do not push deep.</text>

  <rect x="794" y="278" width="346" height="130" rx="16" fill="#FFFFFF"/>
  <circle cx="830" cy="316" r="20" fill="#1FA5A0"/>
  <text x="830" y="323" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="862" y="323" font-size="20" font-weight="bold" fill="#12302E">Moisturize afterward</text>
  <text x="814" y="361" font-size="17" fill="#536866">A thin layer of nasal moisturizer</text>
  <text x="814" y="385" font-size="17" fill="#536866">keeps the lining from drying.</text>

  <!-- Bottom boxes -->
  <rect x="60" y="430" width="530" height="140" rx="16" fill="#EEF4F3"/>
  <rect x="60" y="430" width="10" height="140" rx="5" fill="#C7607D"/>
  <text x="90" y="464" font-size="20" font-weight="bold" fill="#12302E">Avoid</text>
  <text x="90" y="496" font-size="17" fill="#12302E">• Picking or digging with fingernails</text>
  <text x="90" y="520" font-size="17" fill="#12302E">• Deep cotton swabs</text>
  <text x="90" y="544" font-size="17" fill="#12302E">• Tap water for rinses</text>

  <rect x="610" y="430" width="530" height="140" rx="16" fill="#FFFFFF" stroke="#C7607D" stroke-width="3"/>
  <circle cx="644" cy="462" r="14" fill="#C7607D"/>
  <text x="644" y="469" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="670" y="469" font-size="20" font-weight="bold" fill="#12302E">Get urgent care if you have</text>
  <text x="634" y="502" font-size="17" fill="#12302E">Grayish-black crusts with facial pain,</text>
  <text x="634" y="526" font-size="17" fill="#12302E">swelling or fever, especially with</text>
  <text x="634" y="550" font-size="17" fill="#12302E">diabetes or weak immunity.</text>

  <text x="60" y="608" font-size="17" fill="#536866">Crusting, nosebleeds and whistling: ask about a septum hole.</text>
</svg>