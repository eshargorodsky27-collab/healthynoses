<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#E3EEEC"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#12302E">Antihistamine Dry Nose: Why Allergy Medicine Dries You Out</text>
  <text x="60" y="112" font-size="20" fill="#536866">Which allergy medicines are most likely to dry the nose?</text>

  <!-- header -->
  <rect x="60" y="130" width="1080" height="44" rx="8" fill="#12302E"/>
  <text x="76" y="159" font-size="18" font-weight="bold" fill="#FFFFFF">Type of medicine</text>
  <text x="346" y="159" font-size="18" font-weight="bold" fill="#FFFFFF">Common examples</text>
  <text x="722" y="159" font-size="18" font-weight="bold" fill="#FFFFFF">Dryness risk</text>

  <!-- row 1 -->
  <rect x="60" y="180" width="1080" height="60" rx="6" fill="#FFFFFF"/>
  <text x="76" y="204" font-size="18" font-weight="bold" fill="#12302E">Older (first-generation)</text>
  <text x="76" y="226" font-size="18" fill="#12302E">antihistamine pills</text>
  <text x="346" y="204" font-size="18" fill="#12302E">Diphenhydramine, chlorpheniramine,</text>
  <text x="346" y="226" font-size="18" fill="#12302E">doxylamine</text>
  <rect x="722" y="196" width="140" height="30" rx="15" fill="#C7607D"/>
  <text x="792" y="217" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Higher</text>
  <text x="876" y="217" font-size="17" fill="#536866">Also sleepiness, dry mouth</text>

  <!-- row 2 -->
  <rect x="60" y="246" width="1080" height="60" rx="6" fill="#EEF4F3"/>
  <text x="76" y="270" font-size="18" font-weight="bold" fill="#12302E">Newer (second-generation)</text>
  <text x="76" y="292" font-size="18" fill="#12302E">antihistamine pills</text>
  <text x="346" y="270" font-size="18" fill="#12302E">Cetirizine, loratadine,</text>
  <text x="346" y="292" font-size="18" fill="#12302E">fexofenadine</text>
  <rect x="722" y="262" width="140" height="30" rx="15" fill="#1FA5A0"/>
  <text x="792" y="283" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Usually lower</text>
  <text x="876" y="283" font-size="17" fill="#536866">Some still feel dry</text>

  <!-- row 3 -->
  <rect x="60" y="312" width="1080" height="60" rx="6" fill="#FFFFFF"/>
  <text x="76" y="336" font-size="18" font-weight="bold" fill="#12302E">Oral decongestants</text>
  <text x="76" y="358" font-size="18" fill="#12302E">(often in “-D” products)</text>
  <text x="346" y="347" font-size="18" fill="#12302E">Pseudoephedrine</text>
  <rect x="722" y="328" width="140" height="30" rx="15" fill="#C9DAD7"/>
  <text x="792" y="349" font-size="18" font-weight="bold" fill="#12302E" text-anchor="middle">Can dry</text>
  <text x="876" y="349" font-size="17" fill="#536866">Nose and mouth</text>

  <!-- row 4 -->
  <rect x="60" y="378" width="1080" height="60" rx="6" fill="#EEF4F3"/>
  <text x="76" y="414" font-size="18" font-weight="bold" fill="#12302E">Nasal antihistamine sprays</text>
  <text x="346" y="414" font-size="18" fill="#12302E">Azelastine, olopatadine</text>
  <rect x="722" y="394" width="140" height="30" rx="15" fill="#C9DAD7"/>
  <text x="792" y="415" font-size="18" font-weight="bold" fill="#12302E" text-anchor="middle">Local dryness</text>
  <text x="876" y="415" font-size="17" fill="#536866">Or irritation in some</text>

  <!-- row 5 -->
  <rect x="60" y="444" width="1080" height="60" rx="6" fill="#FFFFFF"/>
  <text x="76" y="480" font-size="18" font-weight="bold" fill="#12302E">Nasal steroid sprays</text>
  <text x="346" y="480" font-size="18" fill="#12302E">Fluticasone, mometasone</text>
  <rect x="722" y="460" width="140" height="30" rx="15" fill="#C9DAD7"/>
  <text x="792" y="481" font-size="18" font-weight="bold" fill="#12302E" text-anchor="middle">Some dryness</text>
  <text x="876" y="481" font-size="17" fill="#536866">Crusting, blood spotting</text>

  <!-- callout -->
  <rect x="60" y="518" width="1080" height="70" rx="12" fill="#FFFFFF" stroke="#C7607D" stroke-width="2"/>
  <circle cx="98" cy="553" r="16" fill="#C7607D"/>
  <text x="98" y="560" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="130" y="545" font-size="18" font-weight="bold" fill="#12302E">Crusting, pain or repeated nosebleeds? Get a check-up.</text>
  <text x="130" y="573" font-size="18" fill="#12302E">Never stop a prescribed medicine without asking first.</text>

  <text x="60" y="618" font-size="17" fill="#536866">Source: article overview. Individual reactions vary.</text>
</svg>