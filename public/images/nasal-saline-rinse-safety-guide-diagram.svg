<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#E3EEEC"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#12302E">Nasal Saline Rinses: How to Do Them Safely at Home</text>
  <text x="60" y="114" font-size="20" fill="#536866">The water matters most. Which sources are safe to rinse with?</text>

  <!-- table container -->
  <rect x="60" y="140" width="1080" height="350" rx="14" fill="#FFFFFF" stroke="#C9DAD7" stroke-width="2"/>
  <!-- header -->
  <path d="M60 180 V154 A14 14 0 0 1 74 140 H1126 A14 14 0 0 1 1140 154 V180 Z" fill="#12302E"/>
  <text x="80" y="166" font-size="17" font-weight="bold" fill="#FFFFFF">Water source</text>
  <text x="410" y="166" font-size="17" font-weight="bold" fill="#FFFFFF">Safe to use?</text>
  <text x="580" y="166" font-size="17" font-weight="bold" fill="#FFFFFF">Notes</text>

  <!-- row 1 -->
  <text x="80" y="217" font-size="20" font-weight="bold" fill="#12302E">Distilled or sterile water</text>
  <rect x="410" y="195" width="140" height="32" rx="16" fill="#1FA5A0"/>
  <text x="480" y="217" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Yes</text>
  <text x="580" y="217" font-size="17" fill="#12302E">Sold in jugs at most stores.</text>

  <!-- row 2 -->
  <rect x="62" y="242" width="1076" height="62" fill="#EEF4F3"/>
  <text x="80" y="279" font-size="20" font-weight="bold" fill="#12302E">Tap water, boiled then cooled</text>
  <rect x="410" y="257" width="140" height="32" rx="16" fill="#1FA5A0"/>
  <text x="480" y="279" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Yes</text>
  <text x="580" y="269" font-size="17" fill="#12302E">Boil 3 to 5 minutes (FDA advice). Cool to</text>
  <text x="580" y="291" font-size="17" fill="#12302E">lukewarm. Use within 24 hours.</text>

  <!-- row 3 -->
  <text x="80" y="341" font-size="20" font-weight="bold" fill="#12302E">Tap water with a filter</text>
  <rect x="410" y="319" width="140" height="32" rx="16" fill="#536866"/>
  <text x="480" y="341" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Only if...</text>
  <text x="580" y="331" font-size="17" fill="#12302E">Label must say it removes tiny organisms.</text>
  <text x="580" y="353" font-size="17" fill="#12302E">Ordinary pitcher filters are not enough.</text>

  <!-- row 4 -->
  <rect x="62" y="366" width="1076" height="62" fill="#EEF4F3"/>
  <text x="80" y="403" font-size="20" font-weight="bold" fill="#12302E">Plain tap water</text>
  <rect x="410" y="381" width="140" height="32" rx="16" fill="#C7607D"/>
  <text x="480" y="403" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">No</text>
  <text x="580" y="403" font-size="17" fill="#12302E">Can carry germs that are harmful in the nose.</text>

  <!-- row 5 -->
  <text x="80" y="465" font-size="20" font-weight="bold" fill="#12302E">Bottled drinking water</text>
  <rect x="410" y="443" width="140" height="32" rx="16" fill="#536866"/>
  <text x="480" y="465" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Not reliably</text>
  <text x="580" y="465" font-size="17" fill="#12302E">Not made sterile. Boil it first.</text>

  <!-- bottom cards -->
  <rect x="60" y="506" width="525" height="78" rx="14" fill="#FFFFFF" stroke="#C9DAD7" stroke-width="2"/>
  <rect x="60" y="522" width="8" height="46" fill="#1FA5A0"/>
  <text x="86" y="536" font-size="18" font-weight="bold" fill="#12302E">Salt: aim for 0.9% (isotonic)</text>
  <text x="86" y="563" font-size="17" fill="#536866">A premixed packet helps it not sting.</text>

  <rect x="615" y="506" width="525" height="78" rx="14" fill="#FFFFFF" stroke="#C9DAD7" stroke-width="2"/>
  <rect x="615" y="522" width="8" height="46" fill="#1FA5A0"/>
  <text x="641" y="536" font-size="18" font-weight="bold" fill="#12302E">Device: wash after every use</text>
  <text x="641" y="563" font-size="17" fill="#536866">Air-dry it. Replace on the maker's schedule.</text>

  <text x="60" y="618" font-size="17" fill="#536866">Source: FDA guidance on neti pot safety, as cited in the article.</text>
</svg>