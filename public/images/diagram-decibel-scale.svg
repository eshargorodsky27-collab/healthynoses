<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="660" rx="24" fill="#E3EEEC"/>
  <text x="60" y="78" font-size="34" font-weight="700" fill="#12302E">How loud is loud? Everyday sounds in decibels</text>
  <text x="60" y="116" font-size="20" fill="#536866">Every 10 dB sounds about twice as loud, and safe listening time drops fast above 80 dB.</text>

  <!-- scale bar -->
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#1FA5A0"/>
      <stop offset="0.55" stop-color="#E8B44A"/>
      <stop offset="1" stop-color="#C7607D"/>
    </linearGradient>
  </defs>
  <rect x="80" y="330" width="1040" height="26" rx="13" fill="url(#g)"/>

  <!-- ticks: x = 80 + (dB-20)*1040/100 -->
  <g font-size="18" fill="#12302E" text-anchor="middle">
    <line x1="184" y1="356" x2="184" y2="380" stroke="#12302E" stroke-width="2"/><text x="184" y="404" font-weight="700">30</text>
    <line x1="496" y1="356" x2="496" y2="380" stroke="#12302E" stroke-width="2"/><text x="496" y="404" font-weight="700">60</text>
    <line x1="756" y1="356" x2="756" y2="380" stroke="#12302E" stroke-width="2"/><text x="756" y="404" font-weight="700">85</text>
    <line x1="964" y1="306" x2="964" y2="330" stroke="#12302E" stroke-width="2"/><text x="964" y="296" font-weight="700">105</text>
    <line x1="1068" y1="356" x2="1068" y2="380" stroke="#12302E" stroke-width="2"/><text x="1068" y="404" font-weight="700">115</text>
  </g>
  <g font-size="17" fill="#536866" text-anchor="middle">
    <text x="184" y="436">Whisper</text>
    <text x="496" y="436">Normal talk</text>
    <text x="756" y="436">Heavy traffic</text>
    <text x="964" y="272">Earbuds at max</text>
    <text x="1068" y="436">Loud concert</text>
  </g>

  <!-- WHO reference -->
  <line x1="704" y1="186" x2="704" y2="330" stroke="#12302E" stroke-width="3" stroke-dasharray="8 7"/>
  <rect x="470" y="160" width="468" height="96" rx="14" fill="#fff" stroke="#C9DAD7" stroke-width="2"/>
  <text x="704" y="196" font-size="20" font-weight="700" fill="#12302E" text-anchor="middle">80 dB: WHO-ITU reference for adults</text>
  <text x="704" y="226" font-size="17" fill="#536866" text-anchor="middle">about 40 hours a week of listening allowance</text>

  <text x="60" y="520" font-size="20" font-weight="700" fill="#12302E">Rule of thumb</text>
  <text x="60" y="554" font-size="19" fill="#12302E">If someone next to you can hear your music, or you have to shout over noise, it's too loud.</text>
  <text x="60" y="618" font-size="16" fill="#536866">Sound levels are typical approximations; real levels vary by device and setting. Reference level from the WHO-ITU safe listening standard (2019).</text>
</svg>
