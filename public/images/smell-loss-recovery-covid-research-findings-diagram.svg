<text x="880" y="322" font-size="17" fill="#12302E">Early nasal steroid spray:</text>
<text x="880" y="352" font-size="22" font-weight="bold" fill="#C7607D">very uncertain</text>
<text x="864" y="418" font-size="17" fill="#12302E">No early drug option has</text>
<text x="864" y="442" font-size="17" fill="#12302E">been shown to speed</text>
<text x="864" y="466" font-size="17" fill="#12302E">recovery.</text>
<text x="864" y="518" font-size="17" fill="#536866">Olfactory training: first option</text>

<text x="60" y="598" font-size="17" fill="#536866">Sources: Karamali 2022, Liao 2023, Webster 2022 (Cochrane)</text>
