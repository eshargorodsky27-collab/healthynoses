<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#E3EEEC"/>

  <text x="60" y="78" font-size="34" font-weight="bold" fill="#12302E">Nasal Irrigation for Sinus Symptoms:</text>
  <text x="60" y="118" font-size="34" font-weight="bold" fill="#12302E">What the Studies Show</text>
  <text x="60" y="150" font-size="20" fill="#536866">Three studies of saline rinses, side by side</text>

  <!-- header -->
  <rect x="60" y="168" width="1080" height="34" rx="10" fill="#12302E"/>
  <text x="84" y="191" font-size="17" font-weight="bold" fill="#FFFFFF">Study</text>
  <text x="330" y="191" font-size="17" font-weight="bold" fill="#FFFFFF">Size</text>
  <text x="520" y="191" font-size="17" font-weight="bold" fill="#FFFFFF">What it found</text>
  <text x="930" y="191" font-size="17" font-weight="bold" fill="#FFFFFF">Evidence</text>

  <!-- row 1 -->
  <rect x="60" y="210" width="1080" height="90" rx="14" fill="#FFFFFF"/>
  <rect x="60" y="210" width="8" height="90" rx="4" fill="#1FA5A0"/>
  <text x="84" y="248" font-size="19" font-weight="bold" fill="#12302E">Allergy symptoms</text>
  <text x="84" y="274" font-size="17" fill="#536866">Cochrane review, 2018</text>
  <line x1="310" y1="224" x2="310" y2="286" stroke="#C9DAD7" stroke-width="2"/>
  <text x="330" y="248" font-size="22" font-weight="bold" fill="#1FA5A0">14 trials</text>
  <text x="330" y="274" font-size="17" fill="#12302E">747 people</text>
  <line x1="500" y1="224" x2="500" y2="286" stroke="#C9DAD7" stroke-width="2"/>
  <text x="520" y="248" font-size="17" fill="#12302E">May lower allergy symptom scores;</text>
  <text x="520" y="274" font-size="17" fill="#12302E">no trial followed people past 3 months</text>
  <line x1="910" y1="224" x2="910" y2="286" stroke="#C9DAD7" stroke-width="2"/>
  <rect x="930" y="237" width="190" height="36" rx="18" fill="#EEF4F3" stroke="#C7607D" stroke-width="2"/>
  <circle cx="952" cy="255" r="7" fill="#C7607D"/>
  <text x="967" y="261" font-size="17" font-weight="bold" fill="#12302E">Low quality</text>

  <!-- row 2 -->
  <rect x="60" y="306" width="1080" height="90" rx="14" fill="#FFFFFF"/>
  <rect x="60" y="306" width="8" height="90" rx="4" fill="#1FA5A0"/>
  <text x="84" y="344" font-size="19" font-weight="bold" fill="#12302E">Chronic sinus problems</text>
  <text x="84" y="370" font-size="17" fill="#536866">Cochrane review, 2016</text>
  <line x1="310" y1="320" x2="310" y2="382" stroke="#C9DAD7" stroke-width="2"/>
  <text x="330" y="344" font-size="22" font-weight="bold" fill="#1FA5A0">2 trials</text>
  <text x="330" y="370" font-size="17" fill="#12302E">116 adults</text>
  <line x1="500" y1="320" x2="500" y2="382" stroke="#C9DAD7" stroke-width="2"/>
  <text x="520" y="344" font-size="17" fill="#12302E">Evidence base is thin: only two</text>
  <text x="520" y="370" font-size="17" fill="#12302E">trials met the review's rules</text>
  <line x1="910" y1="320" x2="910" y2="382" stroke="#C9DAD7" stroke-width="2"/>
  <rect x="930" y="333" width="190" height="36" rx="18" fill="#EEF4F3" stroke="#C7607D" stroke-width="2"/>
  <circle cx="952" cy="351" r="7" fill="#C7607D"/>
  <text x="967" y="357" font-size="17" font-weight="bold" fill="#12302E">Low to very low</text>

  <!-- row 3 -->
  <rect x="60" y="402" width="1080" height="90" rx="14" fill="#FFFFFF"/>
  <rect x="60" y="402" width="8" height="90" rx="4" fill="#1FA5A0"/>
  <text x="84" y="440" font-size="19" font-weight="bold" fill="#12302E">Children's sinus trial</text>
  <text x="84" y="466" font-size="17" fill="#536866">Kurt and Yildirim, 2022</text>
  <line x1="310" y1="416" x2="310" y2="478" stroke="#C9DAD7" stroke-width="2"/>
  <text x="330" y="440" font-size="22" font-weight="bold" fill="#1FA5A0">125 children</text>
  <text x="330" y="466" font-size="17" fill="#12302E">6 weeks, twice daily</text>
  <line x1="500" y1="416" x2="500" y2="478" stroke="#C9DAD7" stroke-width="2"/>
  <text x="520" y="440" font-size="17" fill="#12302E">Hypertonic saline linked to better</text>
  <text x="520" y="466" font-size="17" fill="#12302E">quality of life; xylitol poorly tolerated</text>
  <line x1="910" y1="416" x2="910" y2="478" stroke="#C9DAD7" stroke-width="2"/>
  <rect x="930" y="429" width="190" height="36" rx="18" fill="#EEF4F3" stroke="#C7607D" stroke-width="2"/>
  <circle cx="952" cy="447" r="7" fill="#C7607D"/>
  <text x="967" y="453" font-size="17" font-weight="bold" fill="#12302E">Single trial</text>

  <!-- safety strip -->
  <rect x="60" y="506" width="1080" height="56" rx="14" fill="#EEF4F3" stroke="#C9DAD7" stroke-width="2"/>
  <rect x="60" y="506" width="8" height="56" rx="4" fill="#C7607D"/>
  <text x="84" y="530" font-size="17" font-weight="bold" fill="#12302E">Safety: often well tolerated, but nosebleeds and irritation</text>
  <text x="84" y="551" font-size="17" fill="#12302E">were reported, and water safety matters.</text>

  <text x="60" y="594" font-size="17" fill="#536866">Sources: Head 2018 and Chong 2016 (Cochrane); Kurt 2022</text>
</svg>