  <circle cx="90" cy="516" r="9" fill="#1FA5A0"/>
  <text x="112" y="523" font-size="19" font-weight="bold" fill="#FFFFFF">Bottom line: none tested skin or nasal lining.</text>

  <text x="60" y="580" font-size="17" fill="#536866">Source: four reviewed papers, 2010 to 2026</text>
