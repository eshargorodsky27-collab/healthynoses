<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#ECEBDF"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#1E2A1A">Do HEPA Air Purifiers Help Allergies? What Trials Found</text>
  <text x="60" y="110" font-size="20" fill="#5A6455">Cleaner air is clear. Symptom relief is mixed.</text>

  <!-- Left card -->
  <rect x="60" y="140" width="560" height="420" rx="16" fill="#FFFFFF"/>
  <text x="80" y="177" font-size="20" font-weight="bold" fill="#1E2A1A">Cat chamber trial: 30 people</text>
  <line x1="345" y1="195" x2="345" y2="535" stroke="#D9D8C6" stroke-width="2"/>

  <text x="80" y="212" font-size="17" fill="#5A6455">Cat allergen in air</text>
  <text x="80" y="234" font-size="17" fill="#5A6455">(ng/m3)</text>
  <line x1="80" y1="500" x2="330" y2="500" stroke="#5A6455" stroke-width="2"/>
  <rect x="100" y="280" width="80" height="220" fill="#D9D8C6"/>
  <rect x="220" y="460.700" width="80" height="39.300" fill="#4F7F23"/>
  <text x="140" y="270" font-size="22" font-weight="bold" fill="#1E2A1A" text-anchor="middle">79.6</text>
  <text x="260" y="451" font-size="22" font-weight="bold" fill="#4F7F23" text-anchor="middle">14.2</text>
  <text x="140" y="526" font-size="17" fill="#1E2A1A" text-anchor="middle">Before</text>
  <text x="260" y="526" font-size="17" fill="#1E2A1A" text-anchor="middle">Air cleaner</text>

  <text x="365" y="212" font-size="17" fill="#5A6455">Nose and eye symptom</text>
  <text x="365" y="234" font-size="17" fill="#5A6455">score (mean total)</text>
  <line x1="365" y1="500" x2="600" y2="500" stroke="#5A6455" stroke-width="2"/>
  <rect x="385" y="280" width="80" height="220" fill="#D9D8C6"/>
  <rect x="505" y="393.300" width="80" height="106.700" fill="#4F7F23"/>
  <text x="425" y="270" font-size="22" font-weight="bold" fill="#1E2A1A" text-anchor="middle">3.3</text>
  <text x="545" y="383" font-size="22" font-weight="bold" fill="#4F7F23" text-anchor="middle">1.6</text>
  <text x="425" y="526" font-size="17" fill="#1E2A1A" text-anchor="middle">Placebo</text>
  <text x="545" y="526" font-size="17" fill="#1E2A1A" text-anchor="middle">Air cleaner</text>

  <!-- Right card -->
  <rect x="650" y="140" width="490" height="420" rx="16" fill="#FFFFFF"/>
  <text x="670" y="177" font-size="20" font-weight="bold" fill="#1E2A1A">Home trial, dust mite: 6 weeks</text>

  <!-- Row 1 -->
  <circle cx="692" cy="214" r="15" fill="#4F7F23"/>
  <path d="M684 214 L690 220 L701 208" fill="none" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="722" y="214" font-size="18" font-weight="bold" fill="#1E2A1A">Medication scores</text>
  <text x="722" y="237" font-size="17" fill="#5A6455">Improved vs placebo</text>

  <!-- Row 2 -->
  <circle cx="692" cy="282" r="15" fill="#4F7F23"/>
  <path d="M684 282 L690 288 L701 276" fill="none" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="722" y="282" font-size="18" font-weight="bold" fill="#1E2A1A">Bedroom fine particles (PM2.5)</text>
  <text x="722" y="305" font-size="17" fill="#5A6455">Down by up to 51.8%</text>

  <!-- Row 3 -->
  <circle cx="692" cy="350" r="15" fill="#C98A12"/>
  <line x1="685" y1="346" x2="699" y2="346" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round"/>
  <line x1="685" y1="354" x2="699" y2="354" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round"/>
  <text x="722" y="350" font-size="18" font-weight="bold" fill="#1E2A1A">Symptom scores</text>
  <text x="722" y="373" font-size="17" fill="#5A6455">No difference from placebo</text>

  <!-- Row 4 -->
  <circle cx="692" cy="418" r="15" fill="#C98A12"/>
  <line x1="685" y1="414" x2="699" y2="414" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round"/>
  <line x1="685" y1="422" x2="699" y2="422" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round"/>
  <text x="722" y="418" font-size="18" font-weight="bold" fill="#1E2A1A">Quality-of-life scores</text>
  <text x="722" y="441" font-size="17" fill="#5A6455">No difference from placebo</text>

  <!-- Row 5 -->
  <circle cx="692" cy="486" r="15" fill="#C98A12"/>
  <line x1="685" y1="482" x2="699" y2="482" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round"/>
  <line x1="685" y1="490" x2="699" y2="490" stroke="#FFFFFF" stroke-width="3.500" stroke-linecap="round"/>
  <text x="722" y="486" font-size="18" font-weight="bold" fill="#1E2A1A">Visual analog scale scores</text>
  <text x="722" y="509" font-size="17" fill="#5A6455">No difference from placebo</text>

  <!-- Source -->
  <text x="60" y="592" font-size="17" fill="#5A6455">Sources: Resp Med 2025 (PMID 40246248); Yonsei Med J 2020</text>
  <text x="60" y="614" font-size="17" fill="#5A6455">(PMID 32734732). Both trials linked to purifier makers.</text>
</svg>