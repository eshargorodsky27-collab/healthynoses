<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#ECEBDF"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#1E2A1A">When Does a Sinus Infection Need Antibiotics?</text>
  <text x="60" y="112" font-size="20" fill="#5A6455">Timing and severity matter more than mucus color</text>

  <!-- Header row -->
  <rect x="60" y="136" width="190" height="48" rx="8" fill="#1E2A1A"/>
  <text x="72" y="167" font-size="19" font-weight="bold" fill="#FFFFFF">Pattern</text>
  <rect x="262" y="136" width="434" height="48" rx="8" fill="#4F7F23"/>
  <text x="280" y="167" font-size="19" font-weight="bold" fill="#FFFFFF">More like a virus</text>
  <rect x="708" y="136" width="432" height="48" rx="8" fill="#C98A12"/>
  <text x="726" y="167" font-size="19" font-weight="bold" fill="#1E2A1A">More like bacteria</text>

  <!-- Row 1: Length -->
  <rect x="60" y="196" width="190" height="74" rx="8" fill="#F6F5EE" stroke="#D9D8C6" stroke-width="2"/>
  <text x="72" y="240" font-size="19" font-weight="bold" fill="#1E2A1A">Length</text>
  <rect x="262" y="196" width="434" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <rect x="262" y="196" width="8" height="74" fill="#4F7F23"/>
  <text x="286" y="240" font-size="18" fill="#1E2A1A">Improving within about 10 days</text>
  <rect x="708" y="196" width="432" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <rect x="708" y="196" width="8" height="74" fill="#C98A12"/>
  <text x="732" y="240" font-size="18" fill="#1E2A1A">No better after more than 10 days</text>

  <!-- Row 2: Course -->
  <rect x="60" y="278" width="190" height="74" rx="8" fill="#F6F5EE" stroke="#D9D8C6" stroke-width="2"/>
  <text x="72" y="322" font-size="19" font-weight="bold" fill="#1E2A1A">Course</text>
  <rect x="262" y="278" width="434" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <rect x="262" y="278" width="8" height="74" fill="#4F7F23"/>
  <text x="286" y="322" font-size="18" fill="#1E2A1A">Steadily better after the first days</text>
  <rect x="708" y="278" width="432" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <rect x="708" y="278" width="8" height="74" fill="#C98A12"/>
  <text x="732" y="310" font-size="18" fill="#1E2A1A">Better near day 5, then worse again</text>
  <text x="732" y="335" font-size="17" fill="#5A6455">Called "double sickening"</text>

  <!-- Row 3: Start -->
  <rect x="60" y="360" width="190" height="74" rx="8" fill="#F6F5EE" stroke="#D9D8C6" stroke-width="2"/>
  <text x="72" y="404" font-size="19" font-weight="bold" fill="#1E2A1A">Start</text>
  <rect x="262" y="360" width="434" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <rect x="262" y="360" width="8" height="74" fill="#4F7F23"/>
  <text x="286" y="404" font-size="18" fill="#1E2A1A">Mild to moderate symptoms</text>
  <rect x="708" y="360" width="432" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <rect x="708" y="360" width="8" height="74" fill="#C98A12"/>
  <text x="732" y="392" font-size="18" fill="#1E2A1A">Fever above 39 °C with pus-like discharge</text>
  <text x="732" y="417" font-size="18" fill="#1E2A1A">or facial pain, at least 3 days in a row</text>

  <!-- Row 4: Mucus color -->
  <rect x="60" y="442" width="190" height="74" rx="8" fill="#F6F5EE" stroke="#D9D8C6" stroke-width="2"/>
  <text x="72" y="474" font-size="19" font-weight="bold" fill="#1E2A1A">Mucus color</text>
  <text x="72" y="499" font-size="19" font-weight="bold" fill="#1E2A1A">alone</text>
  <rect x="262" y="442" width="878" height="74" rx="8" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <text x="701" y="486" font-size="18" font-weight="bold" fill="#5A6455" text-anchor="middle">Not a reliable clue by itself</text>

  <!-- Urgent strip -->
  <rect x="60" y="528" width="1080" height="60" rx="10" fill="#1E2A1A"/>
  <circle cx="92" cy="558" r="16" fill="#C98A12"/>
  <text x="92" y="565" font-size="21" font-weight="bold" fill="#1E2A1A" text-anchor="middle">!</text>
  <text x="124" y="552" font-size="18" font-weight="bold" fill="#FFFFFF">Get urgent care, do not wait and see:</text>
  <text x="124" y="576" font-size="17" fill="#F6F5EE">severe headache, confusion, or swelling around the eyes</text>

  <text x="60" y="618" font-size="17" fill="#5A6455">Sources: ACP and CDC advice, 2016; acute sinusitis review, 2020</text>
</svg>