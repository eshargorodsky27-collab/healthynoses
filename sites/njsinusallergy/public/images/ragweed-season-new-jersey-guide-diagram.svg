<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#ECEBDF"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#1E2A1A">Ragweed Season in New Jersey: Peak Dates and How to Cope</text>
  <text x="60" y="112" font-size="20" fill="#5A6455">How well a blood IgE test predicted pollen allergy (AUC)</text>

  <!-- chart background -->
  <rect x="60" y="136" width="800" height="330" rx="16" fill="#F6F5EE"/>

  <!-- bars -->
  <text x="250" y="207" font-size="20" font-weight="bold" fill="#1E2A1A" text-anchor="end">Cedar</text>
  <rect x="270" y="175" width="522" height="50" rx="6" fill="#4F7F23"/>
  <text x="804" y="207" font-size="20" font-weight="bold" fill="#1E2A1A">0.87</text>

  <text x="250" y="277" font-size="20" font-weight="bold" fill="#1E2A1A" text-anchor="end">Cypress</text>
  <rect x="270" y="245" width="492" height="50" rx="6" fill="#4F7F23"/>
  <text x="774" y="277" font-size="20" font-weight="bold" fill="#1E2A1A">0.82</text>

  <text x="250" y="347" font-size="20" font-weight="bold" fill="#1E2A1A" text-anchor="end">Orchard grass</text>
  <rect x="270" y="315" width="378" height="50" rx="6" fill="#4F7F23"/>
  <text x="660" y="347" font-size="20" font-weight="bold" fill="#1E2A1A">0.63</text>

  <text x="250" y="417" font-size="20" font-weight="bold" fill="#C98A12" text-anchor="end">Ragweed</text>
  <rect x="270" y="385" width="336" height="50" rx="6" fill="#C98A12"/>
  <text x="618" y="417" font-size="20" font-weight="bold" fill="#1E2A1A">0.56</text>

  <!-- chance line -->
  <line x1="570" y1="164" x2="570" y2="445" stroke="#1E2A1A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="570" y="156" font-size="17" fill="#5A6455" text-anchor="middle">0.5 = chance</text>

  <!-- axis -->
  <line x1="270" y1="445" x2="870" y2="445" stroke="#D9D8C6" stroke-width="2"/>
  <text x="270" y="464" font-size="17" fill="#5A6455" text-anchor="middle">0</text>
  <text x="570" y="464" font-size="17" fill="#5A6455" text-anchor="middle">0.5</text>
  <text x="870" y="464" font-size="17" fill="#5A6455" text-anchor="middle">1.0</text>

  <!-- takeaway panel -->
  <rect x="880" y="136" width="260" height="330" rx="16" fill="#FFFFFF"/>
  <rect x="880" y="136" width="8" height="330" rx="4" fill="#C98A12"/>
  <text x="908" y="176" font-size="20" font-weight="bold" fill="#C98A12">Takeaway</text>
  <text x="908" y="214" font-size="17" fill="#1E2A1A">Ragweed scored only</text>
  <text x="908" y="238" font-size="17" fill="#1E2A1A">0.56, barely above</text>
  <text x="908" y="262" font-size="17" fill="#1E2A1A">chance.</text>
  <text x="908" y="302" font-size="17" fill="#1E2A1A">A blood test alone is a</text>
  <text x="908" y="326" font-size="17" fill="#1E2A1A">weak guide for ragweed.</text>
  <text x="908" y="366" font-size="17" fill="#1E2A1A">Ask an allergist to read</text>
  <text x="908" y="390" font-size="17" fill="#1E2A1A">results together with</text>
  <text x="908" y="414" font-size="17" fill="#1E2A1A">your symptoms.</text>

  <!-- context card -->
  <rect x="60" y="484" width="1080" height="80" rx="16" fill="#FFFFFF"/>
  <text x="84" y="515" font-size="17" fill="#1E2A1A">Study of 132 adults with pollen symptoms and 127 without.</text>
  <text x="84" y="543" font-size="17" fill="#5A6455">Done in Japan, where cedar is the major pollen.</text>

  <text x="60" y="606" font-size="17" fill="#5A6455">Source: 2022 Japanese screening study of IgE blood levels</text>
</svg>