<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#ECEBDF"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#1E2A1A">Sinus Pressure From Allergies: Causes and What Helps</text>
  <text x="60" y="112" font-size="20" fill="#5A6455">How swelling in the nose turns into facial pressure</text>

  <!-- Card 1 -->
  <rect x="60" y="140" width="252" height="280" rx="16" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <circle cx="90" cy="176" r="18" fill="#4F7F23"/>
  <text x="90" y="183" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="78" y="230" font-size="20" font-weight="bold" fill="#1E2A1A">Trigger detected</text>
  <text x="78" y="262" font-size="17" fill="#5A6455">The immune system treats</text>
  <text x="78" y="286" font-size="17" fill="#5A6455">pollen or dust mite</text>
  <text x="78" y="310" font-size="17" fill="#5A6455">waste as a threat.</text>
  <circle cx="156" cy="372" r="9" fill="#C98A12"/>
  <circle cx="186" cy="356" r="9" fill="#C98A12"/>
  <circle cx="216" cy="378" r="9" fill="#C98A12"/>
  <circle cx="171" cy="392" r="6" fill="#C98A12"/>

  <!-- Card 2 -->
  <rect x="336" y="140" width="252" height="280" rx="16" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <circle cx="366" cy="176" r="18" fill="#4F7F23"/>
  <text x="366" y="183" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="354" y="230" font-size="20" font-weight="bold" fill="#1E2A1A">Lining swells</text>
  <text x="354" y="262" font-size="17" fill="#5A6455">The nasal lining becomes</text>
  <text x="354" y="286" font-size="17" fill="#5A6455">inflamed and makes</text>
  <text x="354" y="310" font-size="17" fill="#5A6455">extra mucus.</text>
  <line x1="412" y1="372" x2="512" y2="372" stroke="#D9D8C6" stroke-width="4"/>
  <ellipse cx="462" cy="372" rx="48" ry="22" fill="#4F7F23"/>

  <!-- Card 3 -->
  <rect x="612" y="140" width="252" height="280" rx="16" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <circle cx="642" cy="176" r="18" fill="#4F7F23"/>
  <text x="642" y="183" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="630" y="230" font-size="20" font-weight="bold" fill="#1E2A1A">Openings narrow</text>
  <text x="630" y="262" font-size="17" fill="#5A6455">Swelling narrows the</text>
  <text x="630" y="286" font-size="17" fill="#5A6455">small openings that</text>
  <text x="630" y="310" font-size="17" fill="#5A6455">connect sinuses to nose.</text>
  <ellipse cx="738" cy="354" rx="52" ry="16" fill="#4F7F23"/>
  <ellipse cx="738" cy="392" rx="52" ry="16" fill="#4F7F23"/>
  <line x1="738" y1="364" x2="738" y2="382" stroke="#C98A12" stroke-width="4"/>

  <!-- Card 4 -->
  <rect x="888" y="140" width="252" height="280" rx="16" fill="#FFFFFF" stroke="#D9D8C6" stroke-width="2"/>
  <circle cx="918" cy="176" r="18" fill="#C98A12"/>
  <text x="918" y="183" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="906" y="230" font-size="20" font-weight="bold" fill="#1E2A1A">Pressure builds</text>
  <text x="906" y="262" font-size="17" fill="#5A6455">Mucus and air cannot</text>
  <text x="906" y="286" font-size="17" fill="#5A6455">move out easily, so</text>
  <text x="906" y="310" font-size="17" fill="#5A6455">the face feels full.</text>
  <circle cx="1014" cy="372" r="30" fill="#F6F5EE" stroke="#C98A12" stroke-width="4"/>
  <circle cx="1004" cy="368" r="6" fill="#C98A12"/>
  <circle cx="1022" cy="364" r="6" fill="#C98A12"/>
  <circle cx="1014" cy="382" r="6" fill="#C98A12"/>

  <!-- Arrows -->
  <path d="M318 270 L331 280 L318 290 Z" fill="#4F7F23"/>
  <path d="M594 270 L607 280 L594 290 Z" fill="#4F7F23"/>
  <path d="M870 270 L883 280 L870 290 Z" fill="#4F7F23"/>

  <!-- Callout left -->
  <rect x="60" y="440" width="528" height="90" rx="16" fill="#F6F5EE" stroke="#D9D8C6" stroke-width="2"/>
  <circle cx="90" cy="485" r="12" fill="#4F7F23"/>
  <circle cx="126" cy="485" r="12" fill="#D9D8C6"/>
  <circle cx="162" cy="485" r="12" fill="#D9D8C6"/>
  <circle cx="198" cy="485" r="12" fill="#D9D8C6"/>
  <circle cx="234" cy="485" r="12" fill="#D9D8C6"/>
  <circle cx="270" cy="485" r="12" fill="#D9D8C6"/>
  <text x="306" y="475" font-size="20" font-weight="bold" fill="#1E2A1A">Nearly 1 in 6 Americans</text>
  <text x="306" y="499" font-size="17" fill="#5A6455">have allergic rhinitis, so</text>
  <text x="306" y="520" font-size="17" fill="#5A6455">this pressure is common.</text>

  <!-- Callout right -->
  <rect x="612" y="440" width="528" height="90" rx="16" fill="#FFFFFF" stroke="#C98A12" stroke-width="3"/>
  <circle cx="660" cy="485" r="26" fill="#F6F5EE" stroke="#C98A12" stroke-width="4"/>
  <line x1="660" y1="485" x2="660" y2="468" stroke="#1E2A1A" stroke-width="3"/>
  <line x1="660" y1="485" x2="673" y2="490" stroke="#1E2A1A" stroke-width="3"/>
  <text x="706" y="475" font-size="20" font-weight="bold" fill="#1E2A1A">Pressure past 12 weeks?</text>
  <text x="706" y="499" font-size="17" fill="#5A6455">May be chronic rhinosinusitis.</text>
  <text x="706" y="520" font-size="17" fill="#5A6455">Get a medical evaluation.</text>

  <!-- Takeaway -->
  <rect x="60" y="548" width="1080" height="44" rx="12" fill="#4F7F23"/>
  <text x="600" y="577" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Treat the allergy trigger, not just the pressure.</text>

  <text x="60" y="620" font-size="17" fill="#5A6455">Source: 2015 AAO-HNSF allergic rhinitis guideline</text>
</svg>