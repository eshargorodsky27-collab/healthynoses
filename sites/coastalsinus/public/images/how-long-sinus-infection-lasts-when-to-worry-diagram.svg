<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="640" rx="24" fill="#E9E2D4"/>
<text x="60" y="78" font-size="34" font-weight="bold" fill="#10253A">How Long Does a Sinus Infection Last? When to Worry</text>
<text x="60" y="112" font-size="20" fill="#4E5E6E">Most cases clear on their own; timing guides the next step</text>

<rect x="60" y="136" width="1080" height="256" rx="14" fill="#F5F0E7"/>
<text x="80" y="166" font-size="20" font-weight="bold" fill="#10253A">Day by day: when antibiotics are considered</text>
<text x="80" y="200" font-size="17" fill="#4E5E6E">Day of symptoms</text>
<g font-size="17" fill="#4E5E6E" text-anchor="middle">
<text x="370" y="200">1</text><text x="450" y="200">2</text><text x="530" y="200">3</text><text x="610" y="200">4</text><text x="690" y="200">5</text><text x="770" y="200">6</text><text x="850" y="200">7</text><text x="930" y="200">8</text><text x="1010" y="200">9</text><text x="1090" y="200">10</text>
</g>
<g stroke="#D8CFBE" stroke-width="1">
<line x1="330" y1="208" x2="330" y2="382"/><line x1="410" y1="208" x2="410" y2="382"/><line x1="490" y1="208" x2="490" y2="382"/><line x1="570" y1="208" x2="570" y2="382"/><line x1="650" y1="208" x2="650" y2="382"/><line x1="730" y1="208" x2="730" y2="382"/><line x1="810" y1="208" x2="810" y2="382"/><line x1="890" y1="208" x2="890" y2="382"/><line x1="970" y1="208" x2="970" y2="382"/><line x1="1050" y1="208" x2="1050" y2="382"/><line x1="1130" y1="208" x2="1130" y2="382"/>
</g>
<g font-size="17" fill="#10253A">
<text x="80" y="238">Severe symptoms</text>
<text x="80" y="280">Clear worsening</text>
<text x="80" y="322">Symptoms last</text>
<text x="80" y="364">Typical recovery</text>
</g>
<rect x="490" y="216" width="640" height="32" rx="8" fill="#D9774B"/>
<text x="506" y="238" font-size="17" font-weight="bold" fill="#FFFFFF">3 or more days: consider antibiotics</text>
<rect x="490" y="258" width="240" height="32" rx="8" fill="#D9774B"/>
<text x="506" y="280" font-size="17" font-weight="bold" fill="#FFFFFF">after 3 to 5 days</text>
<rect x="810" y="300" width="320" height="32" rx="8" fill="#D9774B"/>
<text x="826" y="322" font-size="17" font-weight="bold" fill="#FFFFFF">7 or more days</text>
<rect x="810" y="342" width="320" height="32" rx="8" fill="#1F7AA3"/>
<text x="826" y="364" font-size="17" font-weight="bold" fill="#FFFFFF">7 to 10 days, self-limited</text>

<rect x="60" y="406" width="1080" height="96" rx="14" fill="#F5F0E7"/>
<text x="80" y="432" font-size="20" font-weight="bold" fill="#10253A">Acute, subacute or chronic?</text>
<rect x="80" y="444" width="340" height="44" rx="8" fill="#1F7AA3"/>
<rect x="430" y="444" width="340" height="44" rx="8" fill="#D9774B"/>
<rect x="780" y="444" width="340" height="44" rx="8" fill="#10253A"/>
<g font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<text x="250" y="472">Acute: under 4 weeks</text>
<text x="600" y="472">Subacute: 4 to 12 weeks</text>
<text x="950" y="472">Chronic: over 12 weeks</text>
</g>

<rect x="60" y="514" width="1080" height="82" rx="14" fill="#10253A"/>
<circle cx="102" cy="555" r="22" fill="#D9774B"/>
<text x="102" y="564" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
<text x="146" y="548" font-size="20" font-weight="bold" fill="#FFFFFF">Rare but serious: get urgent care for</text>
<text x="146" y="577" font-size="20" fill="#FFFFFF">eye swelling, vision changes, stiff neck, confusion</text>

<text x="60" y="624" font-size="17" fill="#4E5E6E">Sources: American Family Physician 2025 review; StatPearls.</text>
</svg>