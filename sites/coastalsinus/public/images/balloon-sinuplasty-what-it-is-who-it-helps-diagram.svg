<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="640" rx="24" fill="#E9E2D4"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#10253A">Balloon Sinuplasty: What It Is and Who It Helps</text>
  <text x="60" y="112" font-size="20" fill="#4E5E6E">A small balloon widens a blocked sinus opening</text>

  <!-- Left card -->
  <rect x="60" y="135" width="530" height="335" rx="16" fill="#FFFFFF" stroke="#D8CFBE" stroke-width="2"/>
  <rect x="60" y="135" width="530" height="50" rx="16" fill="#1F7AA3"/>
  <rect x="60" y="160" width="530" height="25" fill="#1F7AA3"/>
  <text x="90" y="169" font-size="24" font-weight="bold" fill="#FFFFFF">Better fit</text>

  <g font-size="20" fill="#10253A">
    <circle cx="95" cy="225" r="16" fill="#1F7AA3"/>
    <path d="M87 225 L93 231 L103 219" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="127" y="232">Limited chronic sinusitis, no polyps</text>
    <line x1="80" y1="257" x2="570" y2="257" stroke="#D8CFBE" stroke-width="1.5"/>

    <circle cx="95" cy="295" r="16" fill="#1F7AA3"/>
    <path d="M87 295 L93 301 L103 289" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="127" y="302">Repeated acute sinus infections</text>
    <line x1="80" y1="327" x2="570" y2="327" stroke="#D8CFBE" stroke-width="1.5"/>

    <circle cx="95" cy="365" r="16" fill="#1F7AA3"/>
    <path d="M87 365 L93 371 L103 359" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="127" y="372">Did not improve with medical therapy</text>
    <line x1="80" y1="397" x2="570" y2="397" stroke="#D8CFBE" stroke-width="1.5"/>

    <circle cx="95" cy="435" r="16" fill="#1F7AA3"/>
    <path d="M87 435 L93 441 L103 429" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="127" y="442">Symptoms plus sinus disease on CT</text>
  </g>

  <!-- Right card -->
  <rect x="610" y="135" width="530" height="335" rx="16" fill="#FFFFFF" stroke="#D8CFBE" stroke-width="2"/>
  <rect x="610" y="135" width="530" height="50" rx="16" fill="#D9774B"/>
  <rect x="610" y="160" width="530" height="25" fill="#D9774B"/>
  <text x="640" y="169" font-size="24" font-weight="bold" fill="#FFFFFF">Poor fit</text>

  <g font-size="20" fill="#10253A">
    <circle cx="645" cy="225" r="16" fill="#D9774B"/>
    <path d="M638 218 L652 232 M652 218 L638 232" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="677" y="232">Widespread nasal polyps</text>
    <line x1="630" y1="257" x2="1120" y2="257" stroke="#D8CFBE" stroke-width="1.5"/>

    <circle cx="645" cy="295" r="16" fill="#D9774B"/>
    <path d="M638 288 L652 302 M652 288 L638 302" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="677" y="302">Widespread fungal sinusitis</text>
    <line x1="630" y1="327" x2="1120" y2="327" stroke="#D8CFBE" stroke-width="1.5"/>

    <circle cx="645" cy="365" r="16" fill="#D9774B"/>
    <path d="M638 358 L652 372 M652 358 L638 372" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="677" y="372">Possible tumor or cancer</text>
    <line x1="630" y1="397" x2="1120" y2="397" stroke="#D8CFBE" stroke-width="1.5"/>

    <circle cx="645" cy="435" r="16" fill="#D9774B"/>
    <path d="M638 428 L652 442 M652 428 L638 442" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="677" y="442">Headache with no sinus disease on CT</text>
  </g>

  <!-- Guideline strip -->
  <rect x="60" y="490" width="1080" height="56" rx="12" fill="#F5F0E7" stroke="#D8CFBE" stroke-width="2"/>
  <rect x="60" y="490" width="10" height="56" rx="4" fill="#1F7AA3"/>
  <text x="90" y="526" font-size="20" font-weight="bold" fill="#10253A">2025 guideline: surgeon confirms diagnosis, judges candidacy</text>

  <text x="60" y="598" font-size="17" fill="#4E5E6E">Sources: 2019 review; 2025 surgery guideline</text>
</svg>