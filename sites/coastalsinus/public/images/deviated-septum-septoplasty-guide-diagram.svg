<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#E9E2D4"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#10253A">Deviated Septum and Septoplasty</text>
  <text x="60" y="112" font-size="20" fill="#4E5E6E">One small study of nasal blockage scores, and its limits</text>

  <!-- Chart card -->
  <rect x="60" y="140" width="640" height="410" rx="16" fill="#FFFFFF"/>
  <text x="90" y="178" font-size="19" font-weight="bold" fill="#10253A">Average NOSE-p obstruction score</text>
  <text x="90" y="202" font-size="17" fill="#4E5E6E">Lower score = less nasal blockage</text>

  <line x1="100" y1="500" x2="660" y2="500" stroke="#D8CFBE" stroke-width="3"/>

  <rect x="170" y="260" width="150" height="240" rx="6" fill="#D9774B"/>
  <text x="245" y="248" font-size="30" font-weight="bold" fill="#10253A" text-anchor="middle">65.2</text>
  <text x="245" y="528" font-size="18" fill="#10253A" text-anchor="middle">Before surgery</text>

  <rect x="440" y="413.5" width="150" height="86.5" rx="6" fill="#1F7AA3"/>
  <text x="515" y="402" font-size="30" font-weight="bold" fill="#10253A" text-anchor="middle">23.5</text>
  <text x="515" y="528" font-size="18" fill="#10253A" text-anchor="middle">After surgery</text>

  <!-- Right cards -->
  <rect x="730" y="140" width="410" height="126" rx="14" fill="#F5F0E7"/>
  <rect x="730" y="140" width="8" height="126" rx="4" fill="#1F7AA3"/>
  <text x="758" y="174" font-size="19" font-weight="bold" fill="#10253A">Small, single-hospital study</text>
  <text x="758" y="202" font-size="17" fill="#4E5E6E">27 patients with complex cases had a</text>
  <text x="758" y="226" font-size="17" fill="#4E5E6E">modified extracorporeal septoplasty.</text>

  <rect x="730" y="282" width="410" height="126" rx="14" fill="#F5F0E7"/>
  <rect x="730" y="282" width="8" height="126" rx="4" fill="#D9774B"/>
  <text x="758" y="316" font-size="19" font-weight="bold" fill="#10253A">No control group</text>
  <text x="758" y="344" font-size="17" fill="#4E5E6E">Scores fell, but this cannot show the</text>
  <text x="758" y="368" font-size="17" fill="#4E5E6E">technique beats other treatment.</text>

  <rect x="730" y="424" width="410" height="126" rx="14" fill="#F5F0E7"/>
  <rect x="730" y="424" width="8" height="126" rx="4" fill="#1F7AA3"/>
  <text x="758" y="456" font-size="19" font-weight="bold" fill="#10253A">Patient selection matters</text>
  <text x="758" y="483" font-size="17" fill="#4E5E6E">Two trials found septoplasty patients</text>
  <text x="758" y="507" font-size="17" fill="#4E5E6E">did better than controls. A 2024</text>
  <text x="758" y="531" font-size="17" fill="#4E5E6E">Rhinology commentary urges caution.</text>

  <text x="60" y="588" font-size="17" fill="#4E5E6E">Source: 2024 Brazilian study of 27 patients (NOSE-p)</text>
  <text x="60" y="612" font-size="17" fill="#4E5E6E">Trial context: 2024 Rhinology commentary</text>
</svg>