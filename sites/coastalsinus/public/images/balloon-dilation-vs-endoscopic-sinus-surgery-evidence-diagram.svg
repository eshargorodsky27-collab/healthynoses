<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#E9E2D4"/>
  <text x="60" y="78" font-size="34" font-weight="bold" fill="#10253A" textLength="1060" lengthAdjust="spacingAndGlyphs">Balloon Dilation vs Sinus Surgery: What the Evidence Shows</text>
  <text x="60" y="108" font-size="20" fill="#4E5E6E">Three studies, each with limits on what it can show</text>

  <!-- Panel A -->
  <rect x="60" y="130" width="530" height="280" rx="16" fill="#FFFFFF" stroke="#D8CFBE" stroke-width="2"/>
  <text x="84" y="164" font-size="20" font-weight="bold" fill="#10253A">2023 meta-analysis of 7 studies</text>
  <text x="84" y="190" font-size="17" fill="#4E5E6E">Balloon dilation vs endoscopic surgery</text>
  <text x="84" y="228" font-size="17" fill="#10253A">Pooled symptom-score difference: 0.435</text>
  <rect x="84" y="238" width="440" height="32" rx="6" fill="#F5F0E7"/>
  <rect x="84" y="238" width="239" height="32" rx="6" fill="#1F7AA3"/>
  <text x="84" y="300" font-size="17" fill="#10253A">Meaningful-difference threshold: 0.8</text>
  <rect x="84" y="310" width="440" height="32" rx="6" fill="#D9774B"/>
  <text x="84" y="372" font-size="17" font-weight="bold" fill="#10253A">The result fell below the 0.8 threshold.</text>
  <text x="84" y="396" font-size="17" fill="#4E5E6E">Authors: high-quality evidence is limited.</text>

  <!-- Panel B -->
  <rect x="610" y="130" width="530" height="280" rx="16" fill="#FFFFFF" stroke="#D8CFBE" stroke-width="2"/>
  <text x="634" y="164" font-size="20" font-weight="bold" fill="#10253A">Sham-controlled trial, 59 adults</text>
  <text x="634" y="190" font-size="17" fill="#4E5E6E">Quality-of-life gain at 24 weeks (points)</text>
  <text x="634" y="228" font-size="17" fill="#10253A">Balloon dilation + medical care: 37.3</text>
  <rect x="634" y="238" width="440" height="32" rx="6" fill="#1F7AA3"/>
  <text x="634" y="300" font-size="17" fill="#10253A">Medical care alone: 21.8</text>
  <rect x="634" y="310" width="257" height="32" rx="6" fill="#D9774B"/>
  <text x="634" y="372" font-size="17" font-weight="bold" fill="#10253A">Only just significant (p = 0.0424).</text>
  <text x="634" y="396" font-size="17" fill="#4E5E6E">It did not compare balloon with surgery.</text>

  <!-- Children strip -->
  <rect x="60" y="424" width="1080" height="104" rx="16" fill="#F5F0E7" stroke="#D8CFBE" stroke-width="2"/>
  <text x="84" y="456" font-size="20" font-weight="bold" fill="#10253A">In children: 524 of 14,079 cases were balloon</text>
  <rect x="84" y="470" width="600" height="24" rx="4" fill="#D8CFBE"/>
  <rect x="84" y="470" width="22" height="24" rx="4" fill="#1F7AA3"/>
  <text x="84" y="518" font-size="17" fill="#4E5E6E">Blue = balloon sinuplasty; gray = traditional surgery</text>
  <text x="710" y="488" font-size="17" fill="#10253A">Authors: its role in children is unclear.</text>

  <text x="60" y="562" font-size="17" fill="#4E5E6E">Sources: Sinha 2023 (meta-analysis); Sikand 2019 (trial);</text>
  <text x="60" y="584" font-size="17" fill="#4E5E6E">Thong 2019 (pediatric database review).</text>
</svg>